<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <style>
      /* Fonts load from the repository with relative paths, so the page also opens from disk. */
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 600;
        src: url("../../public/fonts/ibm-plex-sans-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 700;
        src: url("../../public/fonts/ibm-plex-sans-700.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--color-paper);
        color: var(--color-ink);
        font-family: var(--font-text);
      }
      .sheet {
        box-sizing: border-box;
        position: absolute;
        inset: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
        border: 1px solid var(--color-rule);
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 48px;
      }
      .mark {
        display: block;
        width: 176px;
        height: 176px;
        outline: 1px solid var(--color-rule);
      }
      .name {
        font-size: 128px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .promise {
        margin: 0;
        max-width: 40ch;
        color: var(--color-ink-2);
        font-size: 40px;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="lockup">
        <!-- Same drawing as public/favicon.svg, so the preview shows the site icon. -->
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" fill="var(--color-surface)" />
          <rect x="4" y="15" width="24" height="2" fill="var(--color-ink)" />
          <rect x="17" y="12" width="8" height="8" fill="var(--color-ink)" />
        </svg>
        <div class="name" data-name></div>
      </div>
      <p class="promise" data-promise></p>
    </div>
    <script>
      // Texts arrive in the query string so they stay in the share locales, not in this page.
      const params = new URLSearchParams(location.search);
      document.documentElement.lang = params.get("lang") ?? "fr";
      document.querySelector("[data-name]").textContent = params.get("name") ?? "";
      document.querySelector("[data-promise]").textContent = params.get("promise") ?? "";
    </script>
  </body>
</html>
