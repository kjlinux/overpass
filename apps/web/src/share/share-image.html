<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <style>
      /* Fonts load from the repository with relative paths, so the page also opens from disk. */
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 600;
        src: url("../../public/fonts/ibm-plex-sans-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 700;
        src: url("../../public/fonts/ibm-plex-sans-700.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--color-paper);
        color: var(--color-ink);
        font-family: var(--font-text);
      }
      .sheet {
        box-sizing: border-box;
        position: absolute;
        inset: 40px;
        display: grid;
        grid-template-rows: 88px 1fr 96px;
        border: 1px solid var(--color-rule);
      }
      .masthead {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 40px;
        border-bottom: 1px solid var(--color-rule);
        font-size: 32px;
        font-weight: 700;
      }
      .masthead::before {
        content: "";
        width: 16px;
        height: 16px;
        background: var(--color-accent);
      }
      .promise {
        align-self: center;
        margin: 0;
        padding: 0 40px;
        max-width: 15ch;
        font-size: 76px;
        font-weight: 600;
        line-height: 1.02;
        letter-spacing: -0.025em;
      }
      .columns {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--color-rule);
        background: var(--color-surface);
      }
      .columns span + span {
        border-left: 1px solid var(--color-rule);
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="masthead" data-name></div>
      <p class="promise" data-promise></p>
      <div class="columns" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <script>
      // Texts arrive in the query string so they stay in the share locales, not in this page.
      const params = new URLSearchParams(location.search);
      document.documentElement.lang = params.get("lang") ?? "fr";
      document.querySelector("[data-name]").textContent = params.get("name") ?? "";
      document.querySelector("[data-promise]").textContent = params.get("promise") ?? "";
    </script>
  </body>
</html>
